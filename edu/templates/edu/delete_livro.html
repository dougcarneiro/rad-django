{% extends 'base.html' %}
{% block content %}
<h2>Confirmar Exclusão</h2>
<p>Tem certeza que deseja excluir o livro "{{ livro.titulo }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Confirmar</button>
    <a href="{% url 'edu:list_livros' %}">Cancelar</a>
</form>
{% endblock %}
